<body>

  <div id="questions"></div>

      "A rectangle has length 12 cm and breadth 5 cm. Find its area.",
      "Find the value of 15% of 200.",
      "Find the value of 5² + 12².",
      "Solve: 3x - 7 = 11.",
      "Find the area of a square with side 9 cm.",
      "Find the perimeter of a rectangle with length 12 cm and breadth 7 cm.",
      "Simplify: 8x + 5x - 4.",

      output += "<div class='question'><b>Question " + (i + 1) + ":</b> " + questions[i] + "</div>";

    document.getElementById("questions").innerHTML = output;
