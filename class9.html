<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Class 9 Maths Questions | Study Question Hub</title>

  <meta name="description"
        content="Practice Class 9 Maths questions with Study Question Hub. Search and filter questions for Class 9 Maths preparation.">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #e0f2fe;
      font-family: Arial, sans-serif;
      color: #172554;
    }

    header {
      background: #1d4ed8;
      color: white;
      padding: 25px 15px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 32px;
    }

    header p {
      margin-top: 8px;
      font-size: 17px;
    }

    .container {
      max-width: 1000px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .controls {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
      margin-bottom: 20px;
    }

    #search {
      width: 100%;
      padding: 13px;
      border: 2px solid #93c5fd;
      border-radius: 8px;
      font-size: 16px;
      outline: none;
    }

    .buttons {
      margin-top: 15px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .filter {
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      cursor: pointer;
      font-size: 15px;
    }

    .filter:hover {
      background: #1e40af;
    }

    #count {
      margin-top: 15px;
      font-weight: bold;
      color: #1e3a8a;
    }

    .question {
      background: white;
      padding: 18px;
      margin-bottom: 15px;
      border-radius: 10px;
      border-left: 5px solid #2563eb;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .question-number {
      color: #1d4ed8;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .difficulty {
      display: inline-block;
      margin-top: 10px;
      padding: 5px 10px;
      border-radius: 6px;
      background: #dbeafe;
      color: #1e40af;
      font-size: 13px;
      font-weight: bold;
    }

    .back {
      display: inline-block;
      margin: 20px 0 40px;
      background: #1d4ed8;
      color: white;
      padding: 12px 20px;
      border-radius: 8px;
      text-decoration: none;
    }

    .back:hover {
      background: #1e40af;
    }

    #noResult {
      display: none;
      background: white;
      padding: 20px;
      text-align: center;
      border-radius: 10px;
      color: #dc2626;
      font-weight: bold;
    }

    footer {
      background: #172554;
      color: white;
      text-align: center;
      padding: 25px;
      margin-top: 30px;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 25px;
      }

      .question {
        font-size: 15px;
      }

      .filter {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>📐 Class 9 Maths</h1>
    <p>Practice Questions - Study Question Hub</p>
  </header>

  <div class="container">

    <div class="controls">

      <input
        type="text"
        id="search"
        placeholder="🔍 Search a question..."
        onkeyup="filterQuestions()"
      >

      <div class="buttons">
        <button class="filter" onclick="showAll()">All Questions</button>
        <button class="filter" onclick="showDifficulty('Easy')">Easy</button>
        <button class="filter" onclick="showDifficulty('Medium')">Medium</button>
        <button class="filter" onclick="showDifficulty('Hard')">Hard</button>
      </div>

      <div id="count"></div>

    </div>

    <div id="questions"></div>

    <div id="noResult">
      ❌ No question found.
    </div>

    <a class="back" href="index.html">← Back to Home</a>

  </div>

  <footer>
    © 2026 Study Question Hub | Class 9 Maths
  </footer>

  <script>

      },

      {
        text: "Find the value of √81.",
        level: "Easy"
      },

      {
        text: "Find the circumference of a circle with radius 7 cm. Use π = 22/7.",
        level: "Medium"
      },

      {
        text: "A rectangle has length 12 cm and breadth 5 cm. Find its area.",
        level: "Easy"
      },

      {
        text: "Find the value of 15% of 200.",
        level: "Easy"
      },

      {
        text: "Find the value of 5² + 12².",
        level: "Easy"
      },

      {
        text: "Solve: 3x - 7 = 11.",
        level: "Easy"
      },

      {
        text: "Find the area of a square with side 9 cm.",
        level: "Easy"
      },

      {
        text: "Find the perimeter of a rectangle with length 12 cm and breadth 7 cm.",
        level: "Easy"
      },

      {
        text: "Simplify: 8x + 5x - 4.",
        level: "Easy"
      },

      {
        text: "Find √144.",
        level: "Easy"
      },

      {
        text: "Find the value of 25% of 400.",
        level: "Easy"
      },

      {
        text: "Convert 0.75 into a fraction.",
        level: "Medium"
      },

      {
        text: "Find the area of a triangle with base 14 cm and height 8 cm.",
        level: "Easy"
      },

      {
        text: "Find the circumference of a circle with radius 14 cm. Use π = 22/7.",
        level: "Medium"
      },

      {
        text: "Solve: 4x + 9 = 25.",
        level: "Easy"
      },

      {
        text: "Factorise: x² + 7x + 12.",
        level: "Medium"
      },

      {
        text: "Find the value of 2³ × 2².",
        level: "Medium"
      },

      {

        level: "Easy"
      },

      {

      },

      {

      },

      {

      },

        level: "Easy"
      },

      {

      },

      {
        text: "Solve: 5x = 45.",

      },

      {
        text: "Find the value of 6² - 4².",
        level: "Easy"
      },

      {
        text: "Find the area of a parallelogram with base 12 cm and height 5 cm.",

      {

      {

        level: "Medium"
      },

        level: "Medium"

        level: "Easy"
      },

      {
        text: "A number is increased by 20% to become 120. Find the original number.",
        level: "Hard"
      },

      {
        text: "Find the area of a semicircle with radius 7 cm. Use π = 22/7.",
        level: "Medium"
      }

    ];

    let currentFilter = "All";

    function displayQuestions() {

      const container = document.getElementById("questions");
      const searchText =
        document.getElementById("search").value.toLowerCase();

      container.innerHTML = "";

      let visibleQuestions = questions.filter(function(q) {

        const matchesSearch =
          q.text.toLowerCase().includes(searchText);

        const matchesDifficulty =
          currentFilter === "All" ||
          q.level === currentFilter;

        return matchesSearch && matchesDifficulty;

      });

      visibleQuestions.forEach(function(q, index) {

        container.innerHTML += `
          <div class="question">
            <div class="question-number">
              Question ${index + 1}
            </div>

            <div>${q.text}</div>

            <span class="difficulty">
              ${q.level}
            </span>
          </div>
        `;

      });

      document.getElementById("count").innerText =
        "Showing " + visibleQuestions.length +
        " of " + questions.length + " questions";

      document.getElementById("noResult").style.display =
        visibleQuestions.length === 0 ? "block" : "none";
    }

    function filterQuestions() {
      displayQuestions();
    }

    function showAll() {
      currentFilter = "All";
      displayQuestions();
    }

    function showDifficulty(level) {
      currentFilter = level;
      displayQuestions();
    }

    displayQuestions();

  </script>

</body>
</html>
