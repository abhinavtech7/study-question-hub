<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Class 10 Maths Questions | Study Question Hub</title>

  <meta name="description"
    content="Practice Class 10 Maths questions chapter-wise with Easy, Medium and Hard questions on Study Question Hub.">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #e0f2fe;
      font-family: Arial, sans-serif;
      color: #172554;
    }

    header {
      background: #1d4ed8;
      color: white;
      padding: 25px 15px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 32px;
    }

    header p {
      margin-top: 8px;
      font-size: 17px;
    }

    .container {
      max-width: 1000px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .controls {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
      margin-bottom: 20px;
    }

    #search {
      width: 100%;
      padding: 13px;
      border: 2px solid #93c5fd;
      border-radius: 8px;
      font-size: 16px;
      outline: none;
    }

    .buttons {
      margin-top: 15px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .filter {
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      cursor: pointer;
      font-size: 15px;
    }

    .filter:hover {
      background: #1e40af;
    }

    #count {
      margin-top: 15px;
      font-weight: bold;
      color: #1e3a8a;
    }

    .chapter {
      color: #1d4ed8;
      background: white;
      padding: 12px;
      border-radius: 8px;
      margin: 25px 0 12px;
    }

    .question {
      background: white;
      padding: 18px;
      margin-bottom: 15px;
      border-radius: 10px;
      border-left: 5px solid #2563eb;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .question-number {
      color: #1d4ed8;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .difficulty {
      display: inline-block;
      margin-top: 10px;
      padding: 5px 10px;
      border-radius: 6px;
      background: #dbeafe;
      color: #1e40af;
      font-size: 13px;
      font-weight: bold;
    }

    .back {
      display: inline-block;
      margin: 20px 0 40px;
      background: #1d4ed8;
      color: white;
      padding: 12px 20px;
      border-radius: 8px;
      text-decoration: none;
    }

    .back:hover {
      background: #1e40af;
    }

    #noResult {
      display: none;
      background: white;
      padding: 20px;
      text-align: center;
      border-radius: 10px;
      color: #dc2626;
      font-weight: bold;
    }

    footer {
      background: #172554;
      color: white;
      text-align: center;
      padding: 25px;
      margin-top: 30px;
    }

    @media (max-width: 600px) {
      header h1 {
        font-size: 25px;
      }

      .filter {
        width: 100%;
      }

      .question {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>📐 Class 10 Maths</h1>
    <p>Chapter-wise Practice Questions</p>
  </header>

  <div class="container">

    <div class="controls">

      <input
        type="text"
        id="search"
        placeholder="🔍 Search a question..."
        onkeyup="displayQuestions()"
      >

      <div class="buttons">

        <button class="filter" onclick="showAll()">
          All Questions
        </button>

        <button class="filter" onclick="showDifficulty('Easy')">
          Easy
        </button>

        <button class="filter" onclick="showDifficulty('Medium')">
          Medium
        </button>

        <button class="filter" onclick="showDifficulty('Hard')">
          Hard
        </button>

        <button class="filter" onclick="showChapter('All')">
          All Chapters
        </button>

        <button class="filter" onclick="showChapter('Algebra')">
          Algebra
        </button>

        <button class="filter" onclick="showChapter('Geometry')">
          Geometry
        </button>

        <button class="filter" onclick="showChapter('Trigonometry')">
          Trigonometry
        </button>

        <button class="filter" onclick="showChapter('Statistics')">
          Statistics
        </button>

      </div>

      <div id="count"></div>

    </div>

    <div id="questions"></div>

    <div id="noResult">
      ❌ No question found.
    </div>

    <a class="back" href="index.html">
      ← Back to Home
    </a>

  </div>

  <footer>
    © 2026 Study Question Hub | Class 10 Maths
  </footer>


  <script>

    const questions = [

      /* ALGEBRA */

      {
        chapter: "Algebra",
        text: "Use Euclid's division algorithm to find the HCF of 867 and 255.",
        level: "Medium"
      },

      {
        chapter: "Algebra",
        text: "Prove that √5 is irrational.",
        level: "Hard"
      },

      {
        chapter: "Algebra",
        text: "Find the zeroes of 2x² - 7x + 3 and verify the relationship between zeroes and coefficients.",
        level: "Hard"
      },

      {
        chapter: "Algebra",
        text: "If α and β are zeroes of x² - 6x + k, and αβ = 8, find k.",
        level: "Medium"
      },

      {
        chapter: "Algebra",
        text: "Solve: 2x + 3y = 13 and 3x - 2y = 4.",
        level: "Medium"
      },

      {
        chapter: "Algebra",
        text: "Solve graphically: x + y = 5 and 2x - y = 4.",
        level: "Hard"
      },

      {
        chapter: "Algebra",
        text: "Solve: 2x² - 5x - 3 = 0.",
        level: "Medium"
      },

      {
        chapter: "Algebra",
        text: "Find the value of k if x² + kx + 16 has equal roots.",
        level: "Hard"
      },

      {
        chapter: "Algebra",
        text: "The sum of two numbers is 27 and their product is 182. Find the numbers.",
        level: "Medium"
      },

      {
        chapter: "Algebra",
        text: "Find the 20th term of the AP: 5, 9, 13, 17, ...",
        level: "Easy"
      },

      {
        chapter: "Algebra",
        text: "Find the sum of first 30 terms of the AP: 7, 11, 15, ...",
        level: "Medium"
      },

      {
        chapter: "Algebra",
        text: "Which term of the AP 3, 8, 13, ... is 78?",
        level: "Medium"
      },

      {
        chapter: "Algebra",
        text: "Find the sum of all two-digit numbers divisible by 7.",
        level: "Hard"
      },


      /* GEOMETRY */

      {
        chapter: "Geometry",
        text: "Find the distance between A(2, 3) and B(8, 11).",
        level: "Medium"
      },

      {
        chapter: "Geometry",
        text: "Find the midpoint of the line segment joining (-4, 6) and (8, -2).",
        level: "Easy"
      },

      {
        chapter: "Geometry",
        text: "Find the point which divides the line joining (2, 3) and (8, 15) in the ratio 1:2.",
        level: "Hard"
      },

      {
        chapter: "Geometry",
        text: "Find the area of the triangle with vertices (0, 0), (4, 0), and (0, 6).",
        level: "Medium"
      },

      {
        chapter: "Geometry",
        text: "Prove that triangles with equal corresponding angles are similar.",
        level: "Hard"
      },

      {
        chapter: "Geometry",
        text: "In ΔABC, DE ∥ BC. If AD = 3 cm, DB = 2 cm and AE = 4.5 cm, find EC.",
        level: "Hard"
      },

      {
        chapter: "Geometry",
        text: "The areas of two similar triangles are 64 cm² and 100 cm². Find the ratio of their corresponding sides.",
        level: "Hard"
      },

      {
        chapter: "Geometry",
        text: "A tangent touches a circle of radius 5 cm. What is the angle between the radius and tangent at the point of contact?",
        level: "Easy"
      },

      {
        chapter: "Geometry",
        text: "From an external point P, two tangents PA and PB are drawn to a circle. Prove that PA = PB.",
        level: "Hard"
      },

      {
        chapter: "Geometry",
        text: "Find the angle subtended by a diameter at a point on the remaining part of the circle.",
        level: "Easy"
      },

      {
        chapter: "Geometry",
        text: "Find the length of a tangent from a point 13 cm away from the centre of a circle of radius 5 cm.",
        level: "Medium"
      },

      {
        chapter: "Geometry",
        text: "A chord of a circle is 16 cm long and its distance from the centre is 6 cm. Find the radius.",
        level: "Hard"
      },


      /* TRIGONOMETRY */

      {
        chapter: "Trigonometry",
        text: "If tan θ = 3/4, find sin θ and cos θ.",
        level: "Medium"
      },

      {
        chapter: "Trigonometry",
        text: "Prove: sin² A + cos² A = 1.",
        level: "Hard"
      },

      {
        chapter: "Trigonometry",
        text: "If sec θ = 13/12, find tan θ.",
        level: "Medium"
      },

      {
        chapter: "Trigonometry",
        text: "A pole 10 m high casts a shadow 10√3 m long. Find the angle of elevation of the sun.",
        level: "Medium"
      },

      {
        chapter: "Trigonometry",
        text: "From a point 20 m away from a tower, the angle of elevation is 45°. Find the height of the tower.",
        level: "Easy"
      },

      {
        chapter: "Trigonometry",
        text: "The angle of elevation of the top of a building is 30° from a point 30 m away. Find its height.",
        level: "Medium"
      },

      {
        chapter: "Trigonometry",
        text: "Find the area of a sector of angle 90° in a circle of radius 14 cm.",
        level: "Medium"
      },

      {
        chapter: "Trigonometry",
        text: "Find the length of an arc subtending an angle of 120° at the centre of a circle of radius 21 cm.",
        level: "Hard"
      },

      {
        chapter: "Trigonometry",
        text: "Find the area of the region between two concentric circles of radii 14 cm and 7 cm.",
        level: "Medium"
      },

      {
        chapter: "Trigonometry",
        text: "A solid sphere of radius 6 cm is melted to form small spheres of radius 2 cm. Find their number.",
        level: "Hard"
      },

      {
        chapter: "Trigonometry",
        text: "Find the volume of a cone with radius 7 cm and height 24 cm.",
        level: "Medium"
      },

      {
        chapter: "Trigonometry",
        text: "Find the curved surface area of a cylinder with radius 7 cm and height 10 cm.",
        level: "Medium"
      },

      {
        chapter: "Trigonometry",
        text: "A toy is in the form of a cone mounted on a hemisphere, both having radius 3.5 cm. Find its volume if cone height is 4 cm.",
        level: "Hard"
      },


      /* STATISTICS */

      {
        chapter: "Statistics",
        text: "Find the mean of 10, 12, 14, 16, 18, 20.",
        level: "Easy"
      },

      {
        chapter: "Statistics",
        text: "Find the median of 7, 3, 10, 5, 12, 8, 15.",
        level: "Easy"
      },

      {
        chapter: "Statistics",
        text: "Find the mode of 2, 3, 3, 5, 6, 3, 7, 5.",
        level: "Easy"
      },

      {
        chapter: "Statistics",
        text: "A die is thrown once. Find the probability of getting a prime number.",
        level: "Easy"
      },

      {
        chapter: "Statistics",
        text: "Two coins are tossed together. Find the probability of getting exactly one head.",
        level: "Medium"
      },

      {
        chapter: "Statistics",
        text: "A card is drawn from a deck of 52 cards. Find the probability that it is a king.",
        level: "Easy"
      },

      {
        chapter: "Statistics",
        text: "A bag has 5 red, 4 blue and 3 green balls. Find the probability of drawing a blue ball.",
        level: "Medium"
      },

      {
        chapter: "Statistics",
        text: "Find the probability of getting a number greater than 4 when a die is thrown.",
        level: "Easy"
      },

      {
        chapter: "Statistics",
        text: "The mean of 8 observations is 12. If one observation is 16, find the sum of the remaining observations.",
        level: "Medium"
      },

      {
        chapter: "Statistics",
        text: "The median of 5, 9, x, 13, 17 is 11. Find x.",
        level: "Medium"
      },

      {
        chapter: "Statistics",
        text: "Find the probability of drawing a vowel from the letters of the word MATHEMATICS.",
        level: "Hard"
      },

      {
        chapter: "Statistics",
        text: "A number is chosen from 1 to 20. Find the probability that it is divisible by 3 or 5.",
        level: "Hard"
      }

    ];


    let currentFilter = "All";
    let currentChapter = "All";


    function displayQuestions() {

      const container = document.getElementById("questions");

      const searchText =
        document.getElementById("search").value.toLowerCase();

      container.innerHTML = "";

      let visibleQuestions = questions.filter(function(q) {

        const matchesSearch =
          q.text.toLowerCase().includes(searchText);

        const matchesDifficulty =
          currentFilter === "All" ||
          q.level === currentFilter;

        const matchesChapter =
          currentChapter === "All" ||
          q.chapter === currentChapter;

        return matchesSearch &&
               matchesDifficulty &&
               matchesChapter;

      });


      visibleQuestions.forEach(function(q, index) {

        container.innerHTML += `

          <div class="question">

            <div class="question-number">
              Question ${index + 1}
            </div>

            <div>
              ${q.text}
            </div>

            <span class="difficulty">
              ${q.level}
            </span>

          </div>

        `;

      });


      document.getElementById("count").innerText =
        "Showing " + visibleQuestions.length +
        " of " + questions.length + " questions";


      document.getElementById("noResult").style.display =
        visibleQuestions.length === 0
          ? "block"
          : "none";

    }


    function showAll() {

      currentFilter = "All";
      currentChapter = "All";

      displayQuestions();

    }


    function showDifficulty(level) {

      currentFilter = level;

      displayQuestions();

    }


    function showChapter(chapter) {

      currentChapter = chapter;

      displayQuestions();

    }


    displayQuestions();

  </script>

</body>
</html>
