<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Class 12 Science Questions | Study Question Hub</title>

  <meta name="description"
    content="Practice Class 12 Science Physics, Chemistry and Biology questions with Study Question Hub.">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #eef6ff;
      font-family: Arial, sans-serif;
      color: #172554;
    }

    header {
      background: linear-gradient(135deg, #1d4ed8, #2563eb);
      color: white;
      text-align: center;
      padding: 30px 15px;
    }

    header h1 {
      margin: 0;
      font-size: 32px;
    }

    header p {
      margin-top: 10px;
      font-size: 17px;
    }

    .container {
      max-width: 1050px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .controls {
      background: white;
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.10);
      margin-bottom: 25px;
    }

    #search {
      width: 100%;
      padding: 14px;
      border: 2px solid #93c5fd;
      border-radius: 9px;
      font-size: 16px;
      outline: none;
    }

    #search:focus {
      border-color: #2563eb;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 15px;
    }

    button {
      border: none;
      padding: 11px 17px;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      cursor: pointer;
      font-size: 15px;
    }

    button:hover {
      background: #1e40af;
    }

    .subject {
      background: #059669;
    }

    .subject:hover {
      background: #047857;
    }

    .difficulty {
      background: #7c3aed;
    }

    .difficulty:hover {
      background: #5b21b6;
    }

    #count {
      margin-top: 15px;
      font-weight: bold;
      color: #1e3a8a;
    }

    .chapter {
      margin-top: 30px;
    }

    .chapter-title {
      background: #172554;
      color: white;
      padding: 14px 18px;
      border-radius: 10px;
      font-size: 22px;
    }

    .question {
      background: white;
      padding: 18px;
      margin: 12px 0;
      border-radius: 10px;
      border-left: 5px solid #2563eb;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .question-number {
      color: #1d4ed8;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .level {
      display: inline-block;
      margin-top: 12px;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: bold;
    }

    .Easy {
      background: #dcfce7;
      color: #166534;
    }

    .Medium {
      background: #fef3c7;
      color: #92400e;
    }

    .Hard {
      background: #fee2e2;
      color: #991b1b;
    }

    #noResult {
      display: none;
      background: white;
      padding: 25px;
      text-align: center;
      border-radius: 10px;
      color: #dc2626;
      font-weight: bold;
    }

    .navigation {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      margin: 30px 0;
    }

    .nav-button {
      background: #1d4ed8;
      color: white;
      padding: 12px 18px;
      border-radius: 8px;
      text-decoration: none;
    }

    .nav-button:hover {
      background: #1e40af;
    }

    footer {
      background: #172554;
      color: white;
      text-align: center;
      padding: 25px;
      margin-top: 30px;
    }

    @media (max-width: 600px) {

      header h1 {
        font-size: 25px;
      }

      .chapter-title {
        font-size: 19px;
      }

      button {
        width: 100%;
      }

      .question {
        font-size: 15px;
      }

      .navigation a {
        width: 100%;
        text-align: center;
      }
    }
  </style>
</head>

<body>

        <button class="subject" onclick="setSubject('Physics')">

        <button class="subject" onclick="setSubject('Chemistry')">
          🧪 Chemistry

        <button class="subject" onclick="setSubject('Biology')">

      <div class="buttons">

        <button class="difficulty" onclick="setDifficulty('Medium')">

        <button class="difficulty" onclick="setDifficulty('Hard')">

      <div id="count"></div>

    <div id="questions"></div>

    <div class="navigation">

      </a>

      <a class="nav-button" href="#top">
        ⬆️ Back to Top
      </a>

  </div>

  <footer>
    © 2026 Study Question Hub | Class 12 Science

    let currentSubject = "All";
    let currentDifficulty = "All";


    function displayQuestions() {

      const container = document.getElementById("questions");

      const searchText =
        document.getElementById("search").value.toLowerCase();

      container.innerHTML = "";

      let visibleQuestions = questions.filter(function(q) {

        const searchMatch =
          q.text.toLowerCase().includes(searchText);

        const subjectMatch =
          currentSubject === "All" ||
          q.subject === currentSubject;

        const difficultyMatch =
          currentDifficulty === "All" ||
          q.level === currentDifficulty;

        return searchMatch &&
               subjectMatch &&
               difficultyMatch;

      });


      let html = "";
      let lastSubject = "";


      visibleQuestions.forEach(function(q, index) {

        if (q.subject !== lastSubject) {

          html += `
            <div class="chapter">
              <div class="chapter-title">
                ${q.subject}
              </div>
            </div>
          `;

          lastSubject = q.subject;
        }


        html += `
          <div class="question">

            <div class="question-number">
              Question ${index + 1}
            </div>

            <div>
              ${q.text}
            </div>

            <span class="level ${q.level}">
              ${q.level}
            </span>

          </div>
        `;

      });


      container.innerHTML = html;


      document.getElementById("count").innerText =
        "Showing " + visibleQuestions.length +
        " of " + questions.length + " questions";


      document.getElementById("noResult").style.display =
        visibleQuestions.length === 0
          ? "block"
          : "none";

    }


    function setSubject(subject) {
      currentSubject = subject;
      displayQuestions();
    }


    function setDifficulty(level) {
      currentDifficulty = level;
      displayQuestions();
    }


    displayQuestions();

  </script>
