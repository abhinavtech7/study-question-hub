<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <title>Quiz | Study Question Hub</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #e0f2fe;
      color: #172554;

      background: #123c88;

    }

    header p {
      margin: 8px 0 0;
    }

    .container {
      max-width: 800px;
      margin: 30px auto;
      padding: 20px;
    }

    .box {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }

    #setup h2,
    #result h2 {
      text-align: center;
      color: #123c88;
    }

      display: block;

      margin: 18px 0 8px;
    }

    select {
      width: 100%;

      background: white;
    }

    #startBtn,
    #nextBtn,
    #restartBtn {
      background: #123c88;
      color: white;
      border: none;
      padding: 13px 25px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 20px;
    }

    #startBtn {
      width: 100%;
    }

    #startBtn:hover,
    #nextBtn:hover,
    #restartBtn:hover {
      background: #1e40af;
    }

    #progress {
      font-weight: bold;
      color: #123c88;
      margin-bottom: 8px;
    }

    #quizInfo {
      color: #64748b;
      font-weight: bold;
      margin-bottom: 12px;
    }

    #liveScore {
      font-weight: bold;

      font-size: 18px;
    }

    #timer {
      background: #fff7ed;
      color: #c2410c;

      border-radius: 8px;

      font-size: 18px;
    }

    #question {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .option {
      display: block;
      width: 100%;
      padding: 14px;
      margin: 10px 0;
      border: 2px solid #bfdbfe;
      border-radius: 8px;
      background: white;
      text-align: left;
      font-size: 16px;
      cursor: pointer;
    }

    .option:hover {
      background: #eff6ff;
    }

    .option.correct {
      background: #dcfce7;
      border-color: #16a34a;
      color: #166534;
    }

    .option.wrong {
      background: #fee2e2;
      border-color: #dc2626;
      color: #991b1b;
    }

    #nextBtn:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }

    #quizBox,
    #result {
      display: none;
    }

    #result {
      text-align: center;
    }

    #score {
      font-size: 19px;
      line-height: 1.8;
      font-weight: bold;
    }

    /* RESULT PROGRESS BAR */

    .progress-container {
      width: 100%;
      height: 25px;
      background: #e2e8f0;
      border-radius: 20px;
      overflow: hidden;
      margin: 20px 0;
    }

    #progressBar {
      height: 100%;
      width: 0%;
      background: #123c88;
      border-radius: 20px;
      transition: width 1s ease;
    }

    #percentageText {
      font-size: 22px;
      font-weight: bold;
      color: #123c88;
    }

    #grade {
      font-size: 26px;
      font-weight: bold;

    }

    #message {
      font-size: 18px;
      color: #475569;
    }

    .back {
      display: inline-block;
      margin-top: 20px;
      color: #123c88;
      font-weight: bold;
      text-decoration: none;
    }

    .back:hover {
      text-decoration: underline;
    }

    @media (max-width: 600px) {

      .container {
        padding: 12px;
      }

      .box {
        padding: 18px;
      }

      #question {
        font-size: 19px;
      }

      .option {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>

  <header>

    <h1>🧠 Study Question Hub Quiz</h1>

    <p>Learn • Practice • Improve</p>

  </header>


  <div class="container">


    <!-- QUIZ SETUP -->

    <div class="box" id="setup">

      <h2>📚 Choose Your Quiz</h2>

      <label class="select-label">
        Select Class
      </label>

      <select id="classSelect">

        <option value="9">
          Class 9
        </option>

        <option value="10">
          Class 10
        </option>

        <option value="11">
          Class 11
        </option>

        <option value="12">
          Class 12
        </option>

      </select>


      <label class="select-label">
        Select Subject
      </label>

      <select id="subjectSelect">

        <option value="Science">
          Science
        </option>

        <option value="Mathematics">
          Mathematics
        </option>

        <option value="English">
          English
        </option>

        <option value="Social Science">
          Social Science
        </option>

      </select>


      <label class="select-label">
        Select Difficulty
      </label>

      <select id="difficultySelect">

        <option value="Easy">
          🟢 Easy
        </option>

        <option value="Medium">
          🟡 Medium
        </option>

        <option value="Hard">
          🔴 Hard
        </option>

      </select>


      <button id="startBtn"
        onclick="startQuiz()">

        🚀 Start Quiz

      </button>

    </div>


    <!-- QUIZ -->

    <div class="box" id="quizBox">

      <div id="quizInfo"></div>

      <div id="progress"></div>

      <div id="liveScore">
        Score: 0 / 0
      </div>

      <div id="timer">

        ⏱️ Time Left:
        <span id="time">60</span>
        seconds

      </div>

      <div id="question"></div>

      <div id="options"></div>

      <button id="nextBtn"
        onclick="nextQuestion()"
        disabled>

        Next →

      </button>

    </div>


    <!-- RESULT -->

    <div class="box" id="result">

      <h2>🎉 Quiz Completed!</h2>

      <p id="score"></p>

      <div id="percentageText"></div>

      <div class="progress-container">

        <div id="progressBar"></div>

      </div>

      <div id="grade"></div>

      <div id="message"></div>

      <br>

      <button id="restartBtn"
        onclick="newQuiz()">

        🔄 New Quiz

      </button>

    </div>


    <a class="back"
      href="index.html">

      ← Back to Home

    </a>

  </div>


  <script>


    /* QUESTION BANK */

    const questionBank = [

      /* CLASS 9 SCIENCE */

      {
        className: "9",
        subject: "Science",
        difficulty: "Easy",
        question: "What is the SI unit of force?",
        options: [
          "Joule",
          "Newton",
          "Watt",
          "Pascal"
        ],
        answer: "Newton"
      },

      {
        className: "9",
        subject: "Science",
        difficulty: "Easy",
        question: "What is the chemical formula of water?",
        options: [
          "CO₂",
          "H₂O",
          "O₂",
          "H₂"
        ],
        answer: "H₂O"
      },

      {
        className: "9",
        subject: "Science",
        difficulty: "Easy",
        question: "Which organelle is called the powerhouse of the cell?",
        options: [
          "Nucleus",
          "Ribosome",
          "Mitochondria",
          "Vacuole"
        ],
        answer: "Mitochondria"
      },

      {
        className: "9",
        subject: "Science",
        difficulty: "Medium",
        question: "What is the SI unit of momentum?",
        options: [
          "kg m/s",
          "Newton",
          "Joule",
          "Watt"
        ],
        answer: "kg m/s"
      },

      {
        className: "9",
        subject: "Science",
        difficulty: "Medium",
        question: "Which gas is required for photosynthesis?",
        options: [
          "Oxygen",
          "Nitrogen",
          "Carbon dioxide",
          "Hydrogen"
        ],
        answer: "Carbon dioxide"
      },

      {
        className: "9",

        question: "What is acceleration due to gravity on Earth approximately?",
        options: [
          "5.8 m/s²",

        ],
        answer: "9.8 m/s²"
      },

      {
        className: "9",

        difficulty: "Hard",
        question: "A body of mass 5 kg is moving with an acceleration of 2 m/s². What force acts on it?",
        options: [
          "2 N",
          "5 N",

          "20 N"
        ],
        answer: "10 N"
      },

      {
        className: "9",
        subject: "Science",
        difficulty: "Hard",
        question: "Why does a passenger fall forward when a moving bus suddenly stops?",
        options: [
          "Due to gravity",
          "Due to inertia of motion",
          "Due to friction",
          "Due to pressure"
        ],
        answer: "Due to inertia of motion"
      },


      /* CLASS 9 MATHEMATICS */

      {
        className: "9",
        subject: "Mathematics",
        difficulty: "Easy",
        question: "What is √81?",
        options: [
          "7",
          "8",
          "9",
          "10"
        ],
        answer: "9"
      },

      {
        className: "9",
        subject: "Mathematics",
        difficulty: "Easy",
        question: "What is the value of 5²?",
        options: [
          "10",
          "15",
          "20",
          "25"
        ],
        answer: "25"
      },

      {
        className: "9",
        subject: "Mathematics",
        difficulty: "Medium",
        question: "What is 15% of 200?",
        options: [
          "20",
          "25",
          "30",
          "35"
        ],
        answer: "30"
      },

      {
        className: "9",
        subject: "Mathematics",
        difficulty: "Medium",
        question: "What is the HCF of 12 and 18?",
        options: [
          "2",
          "3",
          "6",
          "9"
        ],
        answer: "6"
      },

      {
        className: "9",
        subject: "Mathematics",
        difficulty: "Hard",
        question: "If x + 7 = 15, what is the value of x?",
        options: [
          "6",
          "7",
          "8",
          "9"
        ],
        answer: "8"
      },

      {
        className: "9",
        subject: "Mathematics",
        difficulty: "Hard",
        question: "What is the area of a square whose side is 12 cm?",
        options: [
          "24 cm²",
          "48 cm²",
          "144 cm²",
          "120 cm²"
        ],
        answer: "144 cm²"
      },


      /* CLASS 10 SCIENCE */

      {
        className: "10",
        subject: "Science",
        difficulty: "Easy",
        question: "What is the chemical formula of carbon dioxide?",
        options: [
          "CO",
          "CO₂",
          "C₂O",
          "C₂O₂"
        ],
        answer: "CO₂"
      },

      {
        className: "10",
        subject: "Science",
        difficulty: "Medium",
        question: "Which gas is most abundant in Earth's atmosphere?",
        options: [
          "Oxygen",
          "Nitrogen",
          "Carbon dioxide",
          "Hydrogen"
        ],
        answer: "Nitrogen"
      },

      {
        className: "10",
        subject: "Science",
        difficulty: "Hard",
        question: "Which law explains conservation of mass during a chemical reaction?",
        options: [
          "Law of constant proportions",
          "Law of conservation of mass",
          "Newton's law",
          "Ohm's law"
        ],
        answer: "Law of conservation of mass"
      },


      /* CLASS 11 SCIENCE */

      {
        className: "11",
        subject: "Science",
        difficulty: "Easy",
        question: "What is Newton's second law of motion?",
        options: [
          "F = ma",
          "F = m/a",
          "F = a/m",
          "F = mv"
        ],
        answer: "F = ma"
      },

      {
        className: "11",
        subject: "Science",
        difficulty: "Medium",
        question: "What is the SI unit of energy?",
        options: [
          "Watt",
          "Newton",
          "Joule",
          "Pascal"
        ],
        answer: "Joule"
      },


      /* CLASS 12 SCIENCE */

      {
        className: "12",
        subject: "Science",
        difficulty: "Easy",
        question: "What is the SI unit of electric charge?",
        options: [
          "Ampere",
          "Volt",
          "Coulomb",
          "Ohm"
        ],
        answer: "Coulomb"
      },

      {
        className: "12",
        subject: "Science",
        difficulty: "Medium",
        question: "What is the SI unit of electric current?",
        options: [
          "Volt",
          "Ampere",
          "Ohm",
          "Coulomb"
        ],
        answer: "Ampere"
      }

    ];


    /* SETTINGS */

    const QUESTIONS_PER_QUIZ = 10;

    const QUIZ_TIME = 60;

    let quizQuestions = [];

    let currentQuestion = 0;

    let scoreValue = 0;

    let answered = false;

    let timeLeft = QUIZ_TIME;

    let timerInterval;


    /* START QUIZ */

    function startQuiz() {

      const selectedClass =
        document.getElementById("classSelect").value;

      const selectedSubject =
        document.getElementById("subjectSelect").value;

      const selectedDifficulty =
        document.getElementById("difficultySelect").value;


      let filteredQuestions =
        questionBank.filter(function(q) {

          return (
            q.className === selectedClass &&
            q.subject === selectedSubject &&
            q.difficulty === selectedDifficulty
          );

        });


      if (filteredQuestions.length === 0) {

        alert(
          "Questions for this Class, Subject and Difficulty will be added soon."
        );

        return;

      }


      filteredQuestions.sort(
        () => Math.random() - 0.5
      );


      quizQuestions =
        filteredQuestions.slice(
          0,
          Math.min(
            QUESTIONS_PER_QUIZ,
            filteredQuestions.length
          )
        );


      currentQuestion = 0;

      scoreValue = 0;

      answered = false;

      timeLeft = QUIZ_TIME;


      document.getElementById("setup").style.display = "none";

      document.getElementById("quizBox").style.display = "block";

      document.getElementById("result").style.display = "none";


      document.getElementById("quizInfo").innerText =
        "Class " +
        selectedClass +
        " • " +
        selectedSubject +
        " • " +
        selectedDifficulty;


      document.getElementById("time").innerText =
        timeLeft;


      loadQuestion();

      startTimer();

    }


    /* TIMER */

    function startTimer() {

      clearInterval(timerInterval);


      timerInterval =
        setInterval(function() {

          timeLeft--;

          document.getElementById("time").innerText =
            timeLeft;


          if (timeLeft <= 0) {

            clearInterval(timerInterval);

            showResult();

          }

        }, 1000);

    }


    /* LOAD QUESTION */

    function loadQuestion() {

      answered = false;


      const q =
        quizQuestions[currentQuestion];


      document.getElementById("progress").innerText =
        "Question " +
        (currentQuestion + 1) +
        " of " +
        quizQuestions.length;


      document.getElementById("liveScore").innerText =
        "Score: " +
        scoreValue +
        " / " +
        currentQuestion;


      document.getElementById("question").innerText =
        q.question;


      const optionsDiv =
        document.getElementById("options");


      optionsDiv.innerHTML = "";


      document.getElementById("nextBtn").disabled = true;


      q.options.forEach(function(option) {

        const button =
          document.createElement("button");


        button.type = "button";

        button.innerText = option;

        button.className = "option";


        button.onclick = function() {

          checkAnswer(button, option);

        };


        optionsDiv.appendChild(button);

      });

    }


    /* CHECK ANSWER */

    function checkAnswer(
      button,
      selectedAnswer
    ) {

      if (answered) {
        return;
      }


      answered = true;


      const correctAnswer =
        quizQuestions[
          currentQuestion
        ].answer;


      const allOptions =
        document.querySelectorAll(".option");


      allOptions.forEach(function(optionButton) {

        if (
          optionButton.innerText ===
          correctAnswer
        ) {

          optionButton.classList.add("correct");

        }

      });


      if (
        selectedAnswer ===
        correctAnswer
      ) {

        button.classList.add("correct");

        scoreValue++;

      } else {

        button.classList.add("wrong");

      }


      document.getElementById("liveScore").innerText =
        "Score: " +
        scoreValue +
        " / " +
        (currentQuestion + 1);


      document.getElementById("nextBtn").disabled =
        false;

    }


    /* NEXT */

    function nextQuestion() {

      if (!answered) {
        return;
      }


      currentQuestion++;


      if (
        currentQuestion <
        quizQuestions.length
      ) {

        loadQuestion();

      } else {

        showResult();

      }

    }


    /* RESULT */

    function showResult() {

      clearInterval(timerInterval);


      document.getElementById("quizBox").style.display =
        "none";


      document.getElementById("result").style.display =
        "block";


      const percentage =
        Math.round(
          (
            scoreValue /
            quizQuestions.length
          ) * 100
        );


      let grade = "";

      let message = "";


      if (percentage >= 90) {

        grade = "🏆 A+ — Excellent!";

        message =
          "Outstanding performance! Keep it up.";

      }

      else if (percentage >= 80) {

        grade = "🥇 A — Very Good!";

        message =
          "Very good performance. Keep improving.";

      }

      else if (percentage >= 70) {

        grade = "🟢 B — Good!";

        message =
          "Good work. A little more practice can make you better.";

      }

      else if (percentage >= 60) {

        grade = "🟡 C — Average";

        message =
          "Keep practising and strengthen your concepts.";

      }

      else if (percentage >= 50) {

        grade = "🟠 D — Needs Practice";

        message =
          "Practice more questions and revise your concepts.";

      }

      else {

        grade = "🔴 E — Keep Practising";

        message =
          "Don't give up. Learn the concepts and try again.";

      }


      let highScore =
        Number(
          localStorage.getItem(
            "studyHubHighScore"
          )
        ) || 0;


      if (scoreValue > highScore) {

        highScore = scoreValue;

        localStorage.setItem(
          "studyHubHighScore",
          highScore
        );

      }


      document.getElementById("score").innerHTML =
        "Your Score: " +
        scoreValue +
        " / " +
        quizQuestions.length +

        "<br><br>" +

        "⭐ High Score: " +
        highScore;


      document.getElementById("percentageText").innerText =
        percentage + "%";


      document.getElementById("grade").innerText =
        grade;


      document.getElementById("message").innerText =
        message;


      const progressBar =
        document.getElementById("progressBar");


      progressBar.style.width =
        percentage + "%";

    }


    /* NEW QUIZ */

    function newQuiz() {

      clearInterval(timerInterval);


      document.getElementById("result").style.display =
        "none";


      document.getElementById("quizBox").style.display =
        "none";


      document.getElementById("setup").style.display =
        "block";

    }

  </script>

</body>

</html>
