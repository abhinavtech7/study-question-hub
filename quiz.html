```html
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Quiz | Study Question Hub</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #e0f2fe;
      color: #172554;
    }

    header {
      background: #123c88;
      color: white;
      text-align: center;
      padding: 25px 15px;
    }

    header h1 {
      margin: 0;
      font-size: 30px;
    }

    header p {
      margin: 8px 0 0;
    }

    .container {
      max-width: 800px;
      margin: 30px auto;
      padding: 20px;
    }

    .quiz-box {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }

    #progress {
      font-weight: bold;
      color: #123c88;
      margin-bottom: 8px;
    }

    #liveScore {
      font-weight: bold;
      color: #16a34a;
      margin-bottom: 12px;
      font-size: 18px;
    }

    #timer {
      background: #fff7ed;
      color: #c2410c;
      padding: 10px;
      border-radius: 8px;
      font-weight: bold;
      margin-bottom: 20px;
      text-align: center;
      font-size: 18px;
    }

    #question {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .option {
      display: block;
      width: 100%;
      padding: 14px;
      margin: 10px 0;
      border: 2px solid #bfdbfe;
      border-radius: 8px;
      background: white;
      text-align: left;
      font-size: 16px;
      cursor: pointer;
    }

    .option:hover {
      background: #eff6ff;
    }

    .option.correct {
      background: #dcfce7;
      border-color: #16a34a;
      color: #166534;
    }

    .option.wrong {
      background: #fee2e2;
      border-color: #dc2626;
      color: #991b1b;
    }

    #nextBtn,
    #restartBtn {
      background: #123c88;
      color: white;
      border: none;
      padding: 13px 25px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 15px;
    }

    #nextBtn:hover,
    #restartBtn:hover {
      background: #1e40af;
    }

    #nextBtn:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }

    #result {
      display: none;
      text-align: center;
    }

    #result h2 {
      color: #123c88;
    }

    #score {
      font-size: 19px;
      line-height: 1.8;
      font-weight: bold;
    }

    .back {
      display: inline-block;
      margin-top: 20px;
      color: #123c88;
      font-weight: bold;
      text-decoration: none;
    }

    .back:hover {
      text-decoration: underline;
    }

    @media (max-width: 600px) {

      .container {
        padding: 12px;
      }

      .quiz-box {
        padding: 18px;
      }

      #question {
        font-size: 19px;
      }

      .option {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>

  <header>

    <h1>🧠 Study Question Hub Quiz</h1>

    <p>
      Learn • Practice • Improve
    </p>

  </header>


  <div class="container">

    <!-- QUIZ -->

    <div class="quiz-box" id="quizBox">

      <div id="progress"></div>

      <div id="liveScore">
        Score: 0 / 0
      </div>

      <div id="timer">
        ⏱️ Time Left:
        <span id="time">60</span>
        seconds
      </div>

      <div id="question"></div>

      <div id="options"></div>

      <button id="nextBtn"
        onclick="nextQuestion()"
        disabled>
        Next →
      </button>

    </div>


    <!-- RESULT -->

    <div class="quiz-box" id="result">

      <h2>
        🎉 Quiz Completed!
      </h2>

      <p id="score"></p>

      <button id="restartBtn"
        onclick="restartQuiz()">
        🔄 New Quiz
      </button>

    </div>


    <a class="back"
      href="index.html">
      ← Back to Home
    </a>

  </div>


  <script>


    /* =====================================
       QUESTION BANK
       ===================================== */

    const questions = [

      {
        question: "What is the SI unit of force?",
        options: [
          "Joule",
          "Newton",
          "Watt",
          "Pascal"
        ],
        answer: "Newton"
      },

      {
        question: "What is √81?",
        options: [
          "7",
          "8",
          "9",
          "10"
        ],
        answer: "9"
      },

      {
        question: "What is the chemical formula of water?",
        options: [
          "CO₂",
          "H₂O",
          "O₂",
          "H₂"
        ],
        answer: "H₂O"
      },

      {
        question: "How many sides does a triangle have?",
        options: [
          "2",
          "3",
          "4",
          "5"
        ],
        answer: "3"
      },

      {
        question: "What is the SI unit of momentum?",
        options: [
          "kg m/s",
          "Newton",
          "Joule",
          "Watt"
        ],
        answer: "kg m/s"
      },

      {
        question: "What is 15% of 200?",
        options: [
          "20",
          "25",
          "30",
          "35"
        ],
        answer: "30"
      },

      {
        question: "Which organelle is called the powerhouse of the cell?",
        options: [
          "Nucleus",
          "Ribosome",
          "Mitochondria",
          "Vacuole"
        ],
        answer: "Mitochondria"
      },

      {
        question: "What is the value of 5²?",
        options: [
          "10",
          "15",
          "20",
          "25"
        ],
        answer: "25"
      },

      {
        question: "What is the acceleration due to gravity on Earth approximately?",
        options: [
          "5.8 m/s²",
          "9.8 m/s²",
          "15 m/s²",
          "20 m/s²"
        ],
        answer: "9.8 m/s²"
      },

      {
        question: "Which gas is required for photosynthesis?",
        options: [
          "Oxygen",
          "Nitrogen",
          "Carbon dioxide",
          "Hydrogen"
        ],
        answer: "Carbon dioxide"
      },

      {
        question: "What is the square of 12?",
        options: [
          "124",
          "144",
          "154",
          "164"
        ],
        answer: "144"
      },

      {
        question: "What is the SI unit of work?",
        options: [
          "Newton",
          "Joule",
          "Watt",
          "Pascal"
        ],
        answer: "Joule"
      },

      {
        question: "How many bones are there approximately in an adult human body?",
        options: [
          "106",
          "206",
          "306",
          "406"
        ],
        answer: "206"
      },

      {
        question: "What is the chemical symbol of sodium?",
        options: [
          "So",
          "S",
          "Na",
          "N"
        ],
        answer: "Na"
      },

      {
        question: "What is 25% of 400?",
        options: [
          "50",
          "75",
          "100",
          "125"
        ],
        answer: "100"
      },

      {
        question: "Which planet is known as the Red Planet?",
        options: [
          "Earth",
          "Mars",
          "Jupiter",
          "Venus"
        ],
        answer: "Mars"
      },

      {
        question: "What is the SI unit of power?",
        options: [
          "Joule",
          "Newton",
          "Watt",
          "Pascal"
        ],
        answer: "Watt"
      },

      {
        question: "What is the value of 3³?",
        options: [
          "9",
          "18",
          "27",
          "36"
        ],
        answer: "27"
      },

      {
        question: "Which part of the plant carries water from roots to leaves?",
        options: [
          "Phloem",
          "Xylem",
          "Stomata",
          "Root hair"
        ],
        answer: "Xylem"
      },

      {
        question: "What is the boiling point of water at normal atmospheric pressure?",
        options: [
          "50°C",
          "75°C",
          "100°C",
          "150°C"
        ],
        answer: "100°C"
      },

      {
        question: "What is the value of 7 × 8?",
        options: [
          "48",
          "54",
          "56",
          "64"
        ],
        answer: "56"
      },

      {
        question: "Which gas is most abundant in Earth's atmosphere?",
        options: [
          "Oxygen",
          "Nitrogen",
          "Carbon dioxide",
          "Hydrogen"
        ],
        answer: "Nitrogen"
      },

      {
        question: "What is the HCF of 12 and 18?",
        options: [
          "2",
          "3",
          "6",
          "9"
        ],
        answer: "6"
      },

      {
        question: "What is the perimeter of a square with side 5 cm?",
        options: [
          "10 cm",
          "15 cm",
          "20 cm",
          "25 cm"
        ],
        answer: "20 cm"
      },

      {
        question: "Which organ pumps blood throughout the human body?",
        options: [
          "Lungs",
          "Brain",
          "Heart",
          "Kidney"
        ],
        answer: "Heart"
      },

      {
        question: "What is the chemical formula of carbon dioxide?",
        options: [
          "CO",
          "CO₂",
          "C₂O",
          "C₂O₂"
        ],
        answer: "CO₂"
      },

      {
        question: "What is 2⁵?",
        options: [
          "16",
          "24",
          "32",
          "64"
        ],
        answer: "32"
      },

      {
        question: "Which instrument is used to measure temperature?",
        options: [
          "Barometer",
          "Thermometer",
          "Ammeter",
          "Speedometer"
        ],
        answer: "Thermometer"
      },

      {
        question: "What is the area of a square with side 6 cm?",
        options: [
          "12 cm²",
          "24 cm²",
          "36 cm²",
          "42 cm²"
        ],
        answer: "36 cm²"
      },

      {
        question: "Which blood cells help fight infections?",
        options: [
          "Red blood cells",
          "White blood cells",
          "Platelets",
          "Plasma"
        ],
        answer: "White blood cells"
      }

    ];


    /* =====================================
       SETTINGS
       ===================================== */

    const QUESTIONS_PER_QUIZ = 10;

    const QUIZ_TIME = 60;


    let quizQuestions = [];

    let currentQuestion = 0;

    let score = 0;

    let answered = false;

    let timeLeft = QUIZ_TIME;

    let timerInterval;


    /* =====================================
       CREATE NEW QUIZ
       ===================================== */

    function createNewQuiz() {

      clearInterval(timerInterval);

      let shuffledQuestions =
        [...questions];


      shuffledQuestions.sort(
        () => Math.random() - 0.5
      );


      quizQuestions =
        shuffledQuestions.slice(
          0,
          QUESTIONS_PER_QUIZ
        );


      currentQuestion = 0;

      score = 0;

      answered = false;

      timeLeft = QUIZ_TIME;


      document.getElementById(
        "quizBox"
      ).style.display = "block";


      document.getElementById(
        "result"
      ).style.display = "none";


      document.getElementById(
        "time"
      ).innerText = timeLeft;


      loadQuestion();

      startTimer();

    }


    /* =====================================
       TIMER
       ===================================== */

    function startTimer() {

      clearInterval(timerInterval);


      timerInterval =
        setInterval(function() {

          timeLeft--;


          document.getElementById(
            "time"
          ).innerText = timeLeft;


          if (timeLeft <= 0) {

            clearInterval(
              timerInterval
            );

            showResult();

          }

        }, 1000);

    }


    /* =====================================
       LOAD QUESTION
       ===================================== */

    function loadQuestion() {

      answered = false;


      const q =
        quizQuestions[currentQuestion];


      document.getElementById(
        "progress"
      ).innerText =

        "Question " +
        (currentQuestion + 1) +
        " of " +
        quizQuestions.length;


      document.getElementById(
        "liveScore"
      ).innerText =

        "Score: " +
        score +
        " / " +
        currentQuestion;


      document.getElementById(
        "question"
      ).innerText =
        q.question;


      const optionsDiv =
        document.getElementById(
          "options"
        );


      optionsDiv.innerHTML = "";


      document.getElementById(
        "nextBtn"
      ).disabled = true;


      q.options.forEach(
        function(option) {


          const button =
            document.createElement(
              "button"
            );


          button.type = "button";


          button.innerText =
            option;


          button.className =
            "option";


          button.onclick =
            function() {

              checkAnswer(
                button,
                option
              );

            };


          optionsDiv.appendChild(
            button
          );

        }
      );

    }


    /* =====================================
       CHECK ANSWER
       ===================================== */

    function checkAnswer(
      button,
      selectedAnswer
    ) {


      if (answered) {
        return;
      }


      answered = true;


      const correctAnswer =
        quizQuestions[
          currentQuestion
        ].answer;


      const allOptions =
        document.querySelectorAll(
          ".option"
        );


      allOptions.forEach(
        function(optionButton) {


          if (
            optionButton.innerText ===
            correctAnswer
          ) {

            optionButton.classList.add(
              "correct"
            );

          }

        }
      );


      if (
        selectedAnswer ===
        correctAnswer
      ) {

        button.classList.add(
          "correct"
        );

        score++;

      } else {

        button.classList.add(
          "wrong"
        );

      }


      document.getElementById(
        "liveScore"
      ).innerText =

        "Score: " +
        score +
        " / " +
        (currentQuestion + 1);


      document.getElementById(
        "nextBtn"
      ).disabled = false;

    }


    /* =====================================
       NEXT QUESTION
       ===================================== */

    function nextQuestion() {


      if (!answered) {
        return;
      }


      currentQuestion++;


      if (
        currentQuestion <
        quizQuestions.length
      ) {

        loadQuestion();

      } else {

        showResult();

      }

    }


    /* =====================================
       FINAL RESULT
       ===================================== */

    function showResult() {

      clearInterval(timerInterval);


      document.getElementById(
        "quizBox"
      ).style.display = "none";


      document.getElementById(
        "result"
      ).style.display = "block";


      const percentage =
        Math.round(
          (score /
            quizQuestions.length) *
          100
        );


      let message;


      if (percentage >= 80) {

        message =
          "🏆 Excellent! Keep it up!";

      } else if (percentage >= 50) {

        message =
          "👏 Good Job! Practice more.";

      } else {

        message =
          "📚 Keep Learning and Try Again.";

      }


      let highScore =
        Number(
          localStorage.getItem(
            "studyHubHighScore"
          )
        ) || 0;


      if (score > highScore) {

        highScore = score;


        localStorage.setItem(
          "studyHubHighScore",
          highScore
        );

      }


      document.getElementById(
        "score"
      ).innerHTML =

        "Your Score: " +
        score +
        " / " +
        quizQuestions.length +

        "<br>" +

        "Percentage: " +
        percentage +
        "%" +

        "<br><br>" +

        message +

        "<br><br>" +

        "⭐ High Score: " +
        highScore +
        " / " +
        QUESTIONS_PER_QUIZ;

    }


    /* =====================================
       NEW QUIZ
       ===================================== */

    function restartQuiz() {

      createNewQuiz();

    }


    /* =====================================
       START FIRST QUIZ
       ===================================== */

    createNewQuiz();

  </script>

</body>

</html>
```
